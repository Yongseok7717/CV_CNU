# Compile main.tex on every push to main and publish the PDF as cv.pdf on
# the `pdf` branch of this (public) repository. The homepage
# (sites.google.com/view/yjang/curriculum-vitae) reads it from
#   https://raw.githubusercontent.com/Yongseok7717/CV_CNU/pdf/cv.pdf
# The `pdf` branch holds a single commit that is replaced on every build;
# Overleaf only syncs `main`, so it never sees this branch.
name: Build and publish CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Keep the PDF as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: main.pdf

      - name: Publish cv.pdf to the pdf branch
        run: |
          mkdir publish && cp main.pdf publish/cv.pdf
          cd publish
          git init -q -b pdf
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -q -m "CV built from main@${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" pdf
