# Compile main.tex on every push to main and publish the PDF to the
# public repository Yongseok7717/cv as cv.pdf, which the homepage
# (sites.google.com/view/yjang/curriculum-vitae) displays.
#
# One-time setup: add a fine-grained personal access token with
# "Contents: Read and write" on Yongseok7717/cv only, as the Actions
# secret CV_PUBLISH_TOKEN of this repository.
name: Build and publish CV

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Keep the PDF as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv
          path: main.pdf

      - name: Publish to Yongseok7717/cv
        env:
          TOKEN: ${{ secrets.CV_PUBLISH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::CV_PUBLISH_TOKEN is not set; PDF built but not published."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Yongseok7717/cv.git" public
          cp main.pdf public/cv.pdf
          cd public
          git config user.name  "cv-publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged."
            exit 0
          fi
          git commit -m "Update CV from CV_CNU@${GITHUB_SHA::7}"
          git push
